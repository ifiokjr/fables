# The chibi style: tiny characters about two heads tall, with big anime eyes, mitten hands and
# stubby limbs, who bounce. It shares the anime face; its kit swaps in mittens, and its template
# puts the anime head on a small round body.
name = "chibi"
description = "Chibi: tiny characters about two heads tall with big sparkling eyes, mitten hands, stubby limbs and bouncy motion."
skin = "riso"

[finish]
line = 3.4
detail = 2.0
light = [-12.0, -10.0]
cel-shadow = "#cdbbe0"
far = "#4e4a78"

[line]
stroke = "brush"
colour = "self"         # lines take the colour of what they outline, softer than ink

[shade]
tones = 1
highlight = "rim"       # a soft light edge, for a squeezable look
fill = "flat"

[motion]
timing = "ones"
anticipation = 1.3
overshoot = 1.6         # springy
squash = 1.8
follow-through = 1.4
takes = 1.4           # springy takes
overlap = 1.2
business = 1.2        # never still for long
blink-every = 2.6
idle = "bounce"
idle-amount = 0.55
idle-tempo = 96.0

[face]
turn = 0.42
radius = 112.0
slide = 128.0

# Enormous eyes low on the face, a dot of a nose, a tiny mouth and big blush.
[features]
eye = [38.0, 14.0]
brow = [40.0, -38.0]
brow-weight = 1.6
blush = [56.0, 50.0]
blush-size = [20.0, 8.0]
nose = [2.0, 44.0]
nose-scale = 0.7
nose-shine = false
mouth = [0.0, 74.0]
mouth-scale = 0.5

[eyes]
size = [28.0, 34.0]
iris = [20.0, 28.0]
iris-dark = 0.2
iris-band = 0.4
pupil = [8.0, 11.0]
rim = 2.0
shines = [[-7.0, -11.0, 7.5], [7.0, 10.0, 3.2]]
gaze = [6.0, 4.0]
lash = 9.0
lower-lid = 2.2
lower-lash = 2.0
lashes = true

[inks]
blush = "#f07a8a"
eye = "#ffffff"
maw = "#7a2a3a"
tongue = "#ef8a92"
sock = "#ffffff"
sole = "#e9e4ee"
clean-teeth = "#ffffff"
jam = "#b8323a"
cream = "#f6eacf"
brush = "#4fb3a9"
bristles = "#ffffff"
paste = "#9be3cf"
kraft = "#c99a6b"
string = "#c84a3d"
lens = "#e8f4f8"
bogey = "#8dbf4a"
cap = "#3b4b8c"
badge = "#f2c24b"
satchel = "#5a4a6c"
apron = "#ffffff"
mud = "#6e4a30"

# A kid: about two and a third heads tall (crown of the hair to chin), a big round head on a
# small round body with short, chunky limbs.
[bodies.kid]
neck = [0.0, -316.0]
head-above-neck = 118.0
shoulder-y = -306.0
shoulder-half = 42.0
shoulders-turned = [-36.0, 30.0]
hips-turned = [-14.0, 18.0]
hem-y = -158.0
body-radius = 56.0
leg-width = [38.0, 33.0]
forearm-width = [22.0, 19.0]
hand-scale = 1.2
reach = [92.0, 90.0]
leg-profile = [46.0, 44.0, 36.0, 30.0, 36.0, 30.0, 24.0]
arm-profile = [30.0, 28.0, 24.0, 22.0, 26.0, 22.0, 18.0]
knee-splay = 0.55
floor = true

[bodies.kid.limbs]
pelvis-y = -150.0
ankle-y = -22.0
hip-spread = 18.0
thigh = 66.0
shin = 66.0
upper-arm = 58.0
forearm = 50.0

# A grown-up: about three heads, still big-headed but taller than a kid, with a longer body and
# legs, broader shoulders and a little neck showing.
[bodies.grown-up]
neck = [0.0, -500.0]
head-above-neck = 130.0
shoulder-y = -486.0
shoulder-half = 52.0
shoulders-turned = [-46.0, 38.0]
hips-turned = [-16.0, 22.0]
hem-y = -258.0
body-radius = 64.0
leg-width = [32.0, 27.0]
forearm-width = [22.0, 19.0]
hand-scale = 1.3
reach = [148.0, 146.0]
leg-profile = [44.0, 42.0, 34.0, 29.0, 34.0, 28.0, 23.0]
arm-profile = [32.0, 30.0, 26.0, 23.0, 28.0, 23.0, 19.0]
knee-splay = 0.55
foot-scale = 1.15
floor = true

[bodies.grown-up.limbs]
