# Shojo manga: delicate and dreamy. Thin lines that take the colour of what they outline, very
# large sparkling eyes with long lashes, soft one-tone shading with a rim light, and gentle motion
# with lingering holds that drift. It shares the anime kit and template.
name = "manga-shojo"
description = "Shojo manga: delicate self-coloured lines, very large sparkling eyes with long lashes, soft shading with a rim light, and gentle drifting motion."
skin = "riso"

[finish]
line = 2.4
detail = 1.3
light = [-12.0, -10.0]
cel-shadow = "#e2cfe8"  # a pale rose lilac: shading as a soft blush
far = "#7a6a96"

[line]
stroke = "brush"
colour = "self"

[shade]
tones = 1
highlight = "rim"
fill = "flat"

# Gentle animation on twos: soft eased moves, held poses that keep drifting, a slow follow
# through in hair and clothes, and frequent blinks.
[motion]
timing = "twos"
anticipation = 0.5
overshoot = 0.5
squash = 0.4
moving-hold = 0.6       # held poses drift, as hair and ribbons do in a breeze
follow-through = 1.5
blink-every = 3.5
mouth-rate = 8.0
takes = 0.6           # gentle takes
overlap = 0.6
breath = 0.7          # drifting, breathing figures
weight-shift = 0.4
business = 0.4

[face]
turn = 0.42
radius = 112.0
slide = 128.0

# Eyes sit low and wide, at the middle of the face; the brows ride high above them.
[features]
eye = [37.0, 6.0]
brow = [39.0, -44.0]
brow-weight = 1.4
blush = [52.0, 44.0]
blush-size = [15.0, 4.5]
nose = [2.0, 40.0]
nose-scale = 1.0
nose-shine = false
mouth = [0.0, 70.0]
mouth-scale = 0.55

# Big eyes: a tall coloured iris shaded darker at the top, a pupil, a dark rim, one large and
# one small highlight, a heavy upper lash line with a flick, and a short lower lash.
[eyes]
size = [28.0, 34.0]
iris = [19.0, 27.0]
iris-dark = 0.2
iris-band = 0.5
pupil = [7.5, 11.0]
rim = 2.4
shines = [[-7.0, -11.0, 7.5], [7.0, 9.0, 3.4]]
gaze = [7.0, 5.0]
lash = 10.0
lower-lid = 2.2
lower-lash = 2.2
lashes = true

[inks]
blush = "#f07a8a"
eye = "#ffffff"
maw = "#7a2a3a"
tongue = "#ef8a92"
sock = "#ffffff"
sole = "#e9e4ee"
clean-teeth = "#ffffff"
jam = "#b8323a"
cream = "#f6eacf"
brush = "#4fb3a9"
bristles = "#ffffff"
paste = "#9be3cf"
kraft = "#c99a6b"
string = "#c84a3d"
lens = "#e8f4f8"
bogey = "#8dbf4a"
cap = "#3b4b8c"
badge = "#f2c24b"
satchel = "#5a4a6c"
apron = "#ffffff"
mud = "#6e4a30"

# A kid (about eleven): five and a quarter heads tall, crown of the hair to the soles, with a
# real neck, shoulders wider than the head, long legs and feet a head-width long.
[bodies.kid]
neck = [0.0, -968.0]
head-above-neck = 150.0
shoulder-y = -884.0
shoulder-half = 86.0
shoulders-turned = [-76.0, 58.0]
hips-turned = [-30.0, 40.0]
hem-y = -612.0
body-radius = 80.0
leg-width = [70.0, 26.0]
forearm-width = [34.0, 22.0]
hand-scale = 1.3
reach = [120.0, 300.0]
# Anatomy (see the readme): a full thigh narrowing to the knee, a calf that swells and narrows
# to the ankle; a bare arm from shoulder to wrist under the sleeve.
leg-profile = [110.0, 100.0, 82.0, 68.0, 78.0, 60.0, 38.0]
arm-profile = [64.0, 58.0, 48.0, 40.0, 46.0, 37.0, 29.0]
knee-splay = 0.45
floor = true

[bodies.kid.limbs]
pelvis-y = -580.0
ankle-y = -24.0
hip-spread = 42.0
thigh = 280.0
shin = 280.0
upper-arm = 188.0
forearm = 166.0

