# Shonen manga: bold and kinetic. A heavy ink line, hard two-tone shadows, sharper narrower eyes,
# and punchy motion: big wind-ups, moves on ones and holds on threes, and speed lines behind every
# fast move. It shares the anime kit and template.
name = "manga-shonen"
description = "Shonen manga: a heavy ink line, hard two-tone shadows, sharp narrow eyes, and punchy motion with big wind-ups and speed lines."

[finish]
line = 5.0
detail = 2.2
light = [-16.0, -13.0]
cel-shadow = "#a99cc4"  # deeper: hard, graphic shadows
far = "#3e3a66"

[line]
stroke = "brush"

[shade]
tones = 2
fill = "flat"

# Punchy limited animation: drawings held for three frames, fast moves dropping to ones, big
# wind-ups and overshoots, squash on landings and speed lines behind every fast move.
[motion]
timing = "threes"
modulate = true
anticipation = 1.6      # big wind-ups
overshoot = 1.0
squash = 0.8
smears = 1.0
follow-through = 1.3
blink-every = 5.0
mouth-rate = 8.0
overlap = 0.2         # moves on threes snap between held poses
breath = 0.2
weight-shift = 0.0
business = 0.0
takes = 0.5

[face]
turn = 0.42
radius = 112.0
slide = 128.0

# Eyes sit low and wide, at the middle of the face; the brows ride high above them.
[features]
eye = [37.0, 6.0]
brow = [39.0, -44.0]
brow-weight = 1.4
blush = [52.0, 44.0]
blush-size = [15.0, 4.5]
nose = [2.0, 40.0]
nose-scale = 1.0
nose-shine = false
mouth = [0.0, 70.0]
mouth-scale = 0.55

# Big eyes: a tall coloured iris shaded darker at the top, a pupil, a dark rim, one large and
# one small highlight, a heavy upper lash line with a flick, and a short lower lash.
[eyes]
size = [24.0, 25.0]
iris = [15.0, 20.0]
iris-dark = 0.35
iris-band = 0.5
pupil = [7.5, 11.0]
rim = 2.4
shines = [[-6.5, -10.0, 6.5], [6.0, 9.0, 2.8]]
gaze = [7.0, 5.0]
lash = 10.5
lower-lid = 2.2
lower-lash = 0.0
lashes = false

[inks]
blush = "#f07a8a"
eye = "#ffffff"
maw = "#7a2a3a"
tongue = "#ef8a92"
sock = "#ffffff"
sole = "#e9e4ee"
clean-teeth = "#ffffff"
jam = "#b8323a"
cream = "#f6eacf"
brush = "#4fb3a9"
bristles = "#ffffff"
paste = "#9be3cf"
kraft = "#c99a6b"
string = "#c84a3d"
lens = "#e8f4f8"
bogey = "#8dbf4a"
cap = "#3b4b8c"
badge = "#f2c24b"
satchel = "#5a4a6c"
apron = "#ffffff"
mud = "#6e4a30"

# A kid (about eleven): five and a quarter heads tall, crown of the hair to the soles, with a
# real neck, shoulders wider than the head, long legs and feet a head-width long.
[bodies.kid]
neck = [0.0, -968.0]
head-above-neck = 150.0
shoulder-y = -884.0
shoulder-half = 86.0
shoulders-turned = [-76.0, 58.0]
hips-turned = [-30.0, 40.0]
hem-y = -612.0
body-radius = 80.0
leg-width = [70.0, 26.0]
forearm-width = [34.0, 22.0]
hand-scale = 1.3
reach = [120.0, 300.0]
# Anatomy (see the readme): a full thigh narrowing to the knee, a calf that swells and narrows
# to the ankle; a bare arm from shoulder to wrist under the sleeve.
leg-profile = [110.0, 100.0, 82.0, 68.0, 78.0, 60.0, 38.0]
arm-profile = [64.0, 58.0, 48.0, 40.0, 46.0, 37.0, 29.0]
knee-splay = 0.45
floor = true

[bodies.kid.limbs]
pelvis-y = -580.0
ankle-y = -24.0
hip-spread = 42.0
thigh = 280.0
shin = 280.0
upper-arm = 188.0
forearm = 166.0

# A grown-up: about seven heads, the same head on a long body.
[bodies.grown-up]
