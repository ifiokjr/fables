arm-profile = [25.0, 23.0, 20.0, 17.0, 19.0, 15.0, 12.5]
foot-scale = 1.3
floor = true

# A stout build fills out the slim body further than the default, so it reads at a glance.
stout = { chest = 1.3, waist = 1.6, limbs = 1.45 }

[bodies.grown-up.limbs]
