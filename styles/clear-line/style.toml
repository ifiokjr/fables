# The clear-line style: every line the same weight, inside and out, with no hatching; flat,
# vivid colour with no shading; simple cartoony characters with dot eyes, meant for detailed
# settings that get their depth from layered planes rather than shadow. It moves with
# restraint: gentle eases, little squash. Pages read best in the `clear` skin.
name = "clear-line"
description = "Clear line: one even line everywhere, flat vivid colour with no shading, simple characters with dot eyes, and restrained, eased motion."

[finish]
line = 3.0              # one weight for every line
detail = 3.0
light = [-8.0, -8.0]
cel-shadow = "#d4cbe0"
far = "#6e6a80"

[line]
stroke = "uniform"
colour = "ink"

[shade]
tones = 0               # flat colour
fill = "flat"

[motion]
timing = "ones"
anticipation = 0.35     # gentle wind-ups
overshoot = 0.3         # and barely any overshoot
squash = 0.35
follow-through = 0.5
takes = 0.5           # restrained takes
overlap = 0.5
arcs = 0.8
breath = 0.6
weight-shift = 0.5
business = 0.5

[face]
turn = 0.42
radius = 108.0
slide = 128.0

# Dot eyes set wide, a small nose and mouth.
[features]
eye = [30.0, 0.0]
brow = [31.0, -28.0]
brow-weight = 1.6
blush = [50.0, 40.0]
blush-size = [9.0, 5.0]
nose = [4.0, 30.0]
nose-scale = 0.75
nose-shine = false
mouth = [0.0, 62.0]
mouth-scale = 0.75

[eyes]
size = [6.0, 7.5]
iris = [6.0, 7.5]
iris-dark = 1.0
iris-band = 0.0
pupil = [0.0, 0.0]
rim = 0.0
shines = [[-1.6, -2.4, 1.3], [0.0, 0.0, 0.0]]
gaze = [3.0, 3.0]
lash = 2.4
lower-lid = 1.8
lower-lash = 0.0
lashes = false

[inks]
blush = "#ee6a5a"
eye = "#fffcf5"
maw = "#6a2034"
tongue = "#e9747c"
sock = "#f8f1e4"
sole = "#f2e4c8"
clean-teeth = "#fff5da"
jam = "#b8323a"
cream = "#f6eacf"
brush = "#4fb3a9"
bristles = "#fffcf5"
paste = "#9be3cf"
kraft = "#c99a6b"
string = "#c84a3d"
lens = "#e8f4f8"
bogey = "#8dbf4a"
cap = "#c9473d"
badge = "#f2c24b"
satchel = "#a85a3c"
apron = "#f8f1e4"
mud = "#6e4a30"

