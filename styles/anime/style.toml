# The anime style: slender kids and grown-ups with the head about a quarter of their height,
# big layered eyes set low on the face, a tiny nose and mouth, thin even lines and hard
# two-tone cel shading. Every number here is in figure units (the soles at y = 0) or head
# units (the origin between the eyes).
name = "anime"
description = "Slender anime characters: big layered eyes with two highlights, spiky hair, a tiny nose and mouth, thin even lines and hard two-tone cel shading."

[finish]
line = 2.8              # thin, even outlines
detail = 1.7
light = [-15.0, -12.0]  # a bigger offset gives a crisp, broad band of shadow
cel-shadow = "#c4b2dc"  # a cooler, deeper lilac: two clear tones rather than a soft shade
far = "#4e4a78"

[face]
turn = 0.42
radius = 112.0
slide = 128.0

# Eyes sit low and wide, at the middle of the face; the brows ride high above them.
[features]
eye = [37.0, 6.0]
brow = [39.0, -44.0]
brow-weight = 1.4
blush = [52.0, 44.0]
blush-size = [17.0, 5.5]
nose = [2.0, 40.0]
nose-scale = 1.0
nose-shine = false
mouth = [0.0, 70.0]
mouth-scale = 0.55

# Big eyes: a tall coloured iris shaded darker at the top, a pupil, a dark rim, one large and
# one small highlight, a heavy upper lash line with a flick, and a short lower lash.
[eyes]
size = [25.0, 31.0]
iris = [17.0, 25.0]
iris-dark = 0.15
iris-band = 0.42
pupil = [7.5, 11.0]
rim = 2.0
shines = [[-6.5, -10.0, 6.5], [6.0, 9.0, 2.8]]
gaze = [7.0, 5.0]
lash = 9.0
lower-lid = 2.2
lower-lash = 2.2
lashes = true

[inks]
blush = "#f07a8a"
eye = "#ffffff"
maw = "#7a2a3a"
tongue = "#ef8a92"
sock = "#ffffff"
sole = "#e9e4ee"
clean-teeth = "#ffffff"
jam = "#b8323a"
cream = "#f6eacf"
brush = "#4fb3a9"
bristles = "#ffffff"
paste = "#9be3cf"
kraft = "#c99a6b"
string = "#c84a3d"
lens = "#e8f4f8"
bogey = "#8dbf4a"
cap = "#3b4b8c"
badge = "#f2c24b"
satchel = "#5a4a6c"
apron = "#ffffff"
mud = "#6e4a30"

# The dials (see src/art/dials.rs). These are the cartoon values, which every style starts from.
[line]
stroke = "brush"        # thick-and-thin: a heavier pass swells the line on the shadow side
colour = "ink"

[shade]
tones = 1               # one tone of cel shadow
highlight = "none"
fill = "flat"

[motion]
timing = "ones"         # a new drawing every frame
easing = "eased"        # every move winds up, overshoots and settles
anticipation = 1.0
overshoot = 1.0
squash = 1.0
follow-through = 1.0
limbs = "jointed"
blink-every = 3.0

# A kid (eleven or twelve): about 900 tall, the head a quarter of it, long legs.
[bodies.kid]
neck = [0.0, -690.0]
head-above-neck = 100.0
shoulder-y = -650.0
shoulder-half = 50.0
shoulders-turned = [-44.0, 34.0]
hips-turned = [-16.0, 22.0]
hem-y = -400.0
body-radius = 58.0
leg-width = [32.0, 19.0]
forearm-width = [19.0, 13.0]
hand-scale = 1.4
reach = [88.0, 224.0]

[bodies.kid.limbs]
pelvis-y = -420.0
ankle-y = -24.0
hip-spread = 22.0
thigh = 200.0
shin = 200.0
upper-arm = 140.0
forearm = 128.0

# A grown-up: about 1100 tall, the head a fifth of it.
[bodies.grown-up]
neck = [0.0, -900.0]
head-above-neck = 100.0
shoulder-y = -858.0
shoulder-half = 62.0
shoulders-turned = [-56.0, 44.0]
hips-turned = [-20.0, 28.0]
hem-y = -540.0
body-radius = 70.0
leg-width = [36.0, 22.0]
forearm-width = [21.0, 14.0]
hand-scale = 1.6
reach = [112.0, 290.0]

[bodies.grown-up.limbs]
pelvis-y = -560.0
ankle-y = -24.0
hip-spread = 28.0
thigh = 270.0
shin = 270.0
upper-arm = 180.0
forearm = 166.0
