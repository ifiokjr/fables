# The anime style: slender kids and grown-ups with the head about a quarter of their height,
# big layered eyes set low on the face, a tiny nose and mouth, thin even lines and hard
# two-tone cel shading. Every number here is in figure units (the soles at y = 0) or head
# units (the origin between the eyes).
name = "anime"
description = "Slender anime characters: big layered eyes with two highlights, spiky hair, a tiny nose and mouth, thin even lines and hard two-tone cel shading."
skin = "riso"

[finish]
line = 2.8              # thin, even outlines
detail = 1.7
light = [-15.0, -12.0]  # a bigger offset gives a crisp, broad band of shadow
cel-shadow = "#c4b2dc"  # a cooler, deeper lilac: two clear tones rather than a soft shade
far = "#4e4a78"

[face]
turn = 0.42
radius = 112.0
slide = 128.0

# Eyes sit low and wide, at the middle of the face; the brows ride high above them.
[features]
eye = [37.0, 6.0]
brow = [39.0, -44.0]
brow-weight = 1.4
blush = [52.0, 44.0]
blush-size = [17.0, 5.5]
nose = [2.0, 40.0]
nose-scale = 1.0
nose-shine = false
mouth = [0.0, 70.0]
mouth-scale = 0.55

# Big eyes: a tall coloured iris shaded darker at the top, a pupil, a dark rim, one large and
# one small highlight, a heavy upper lash line with a flick, and a short lower lash.
[eyes]
size = [25.0, 31.0]
iris = [17.0, 25.0]
iris-dark = 0.15
iris-band = 0.42
pupil = [7.5, 11.0]
rim = 2.0
shines = [[-6.5, -10.0, 6.5], [6.0, 9.0, 2.8]]
gaze = [7.0, 5.0]
lash = 9.0
lower-lid = 2.2
lower-lash = 2.2
lashes = true

[inks]
blush = "#f07a8a"
eye = "#ffffff"
maw = "#7a2a3a"
tongue = "#ef8a92"
sock = "#ffffff"
sole = "#e9e4ee"
clean-teeth = "#ffffff"
jam = "#b8323a"
cream = "#f6eacf"
brush = "#4fb3a9"
bristles = "#ffffff"
paste = "#9be3cf"
kraft = "#c99a6b"
string = "#c84a3d"
lens = "#e8f4f8"
bogey = "#8dbf4a"
cap = "#3b4b8c"
badge = "#f2c24b"
satchel = "#5a4a6c"
apron = "#ffffff"
mud = "#6e4a30"

# The dials (see src/art/dials.rs). These are the cartoon values, which every style starts from.
[line]
stroke = "brush"        # thick-and-thin: a heavier pass swells the line on the shadow side
colour = "ink"

[shade]
tones = 1               # one tone of cel shadow
highlight = "none"
fill = "flat"

[motion]
timing = "ones"         # a new drawing every frame
easing = "eased"        # every move winds up, overshoots and settles
anticipation = 1.0
overshoot = 1.0
squash = 1.0
follow-through = 1.0
limbs = "jointed"
blink-every = 3.0

# A kid (about eleven): five and a quarter heads tall, crown of the hair to the soles, with a
# real neck, shoulders wider than the head, long legs and feet a head-width long.
[bodies.kid]
neck = [0.0, -968.0]
head-above-neck = 150.0
shoulder-y = -884.0
shoulder-half = 86.0
shoulders-turned = [-76.0, 58.0]
hips-turned = [-30.0, 40.0]
hem-y = -612.0
body-radius = 80.0
leg-width = [70.0, 26.0]
forearm-width = [34.0, 22.0]
hand-scale = 1.3
reach = [120.0, 300.0]
# Anatomy (see the readme): a full thigh narrowing to the knee, a calf that swells and narrows
# to the ankle; a bare arm from shoulder to wrist under the sleeve.
leg-profile = [110.0, 100.0, 82.0, 68.0, 78.0, 60.0, 38.0]
arm-profile = [64.0, 58.0, 48.0, 40.0, 46.0, 37.0, 29.0]
knee-splay = 0.45
# Arms keep a slight bend at the elbow, however far they reach.
elbow = 0.96
floor = true

[bodies.kid.limbs]
pelvis-y = -580.0
ankle-y = -24.0
hip-spread = 42.0
thigh = 280.0
shin = 280.0
upper-arm = 188.0
forearm = 166.0

# A grown-up: about seven heads, the same head on a long body.
[bodies.grown-up]
neck = [0.0, -1324.0]
head-above-neck = 150.0
shoulder-y = -1222.0
shoulder-half = 112.0
shoulders-turned = [-98.0, 80.0]
hips-turned = [-40.0, 52.0]
hem-y = -876.0
body-radius = 104.0
leg-width = [92.0, 32.0]
forearm-width = [44.0, 30.0]
hand-scale = 1.55
reach = [150.0, 420.0]
leg-profile = [140.0, 126.0, 100.0, 82.0, 94.0, 70.0, 46.0]
arm-profile = [84.0, 74.0, 62.0, 52.0, 60.0, 48.0, 38.0]
foot-scale = 1.25
knee-splay = 0.45
# Arms keep a slight bend at the elbow, however far they reach.
elbow = 0.96
floor = true

[bodies.grown-up.limbs]
pelvis-y = -830.0
ankle-y = -24.0
hip-spread = 54.0
thigh = 406.0
shin = 406.0
upper-arm = 268.0
forearm = 238.0
