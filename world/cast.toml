# The folk of Kerfuffle.
#
# Every table is one character. The id (the table name) is what scripts use after `@`, e.g.
# `@stinky wave`. Add `.something` to the id in a script for extra copies of the same
# character (`@stinky.monday`), which is handy for "before and after" pages.
#
# People (kind = "kid" or "grown-up") are built from puppet parts:
#   skin, hair-colour, top, trim, bottom, shoes   palette names (see world/kerfuffle.md) or "#rrggbb"
#   hair      bald | tuft | bun | curls | pigtails | bob | spikes | puff | fringe
#   pattern   plain | stripes | dots | star       (on the top, drawn in the trim colour)
#   legwear   shorts | trousers | skirt
#   extras    freckles, glasses, moustache, apron, post-cap, satchel, bow, muddy-hands, bogey, lashes
#   mouth     mouth width (1.0 is normal)
#   head      round | egg | wide          (silhouette of the head)
#   body      bell | bean | pear | round  (silhouette of the body)
#   nose      button | round | long | none
#   eyes      iris colour (palette name)
#   puppet    an authored puppet's part file, e.g. "puppets/stinky.svg": the character is drawn
#             from it instead of the shape fields above (`fables puppet check`, `template` and
#             `sheet` work with these). Kids only, for now.
#
# Animals and things: kind = "dog" | "bird" | "worm" | "flower" | "tree" | "toothbrush", with
# `colour`. Scripts can also use generic `@bird.a`, `@flower.b` and so on without a table here.
#
# `habit` marks a character as the star of their own tale; they appear on the
# "Have you met the rest of Kerfuffle?" page at the back of other books.
#
# `[id.voice]` is the character's own voice for dialogue (used when a script sets
# `[video] cast-voices = true`). The drafts below use offline macOS voices. For production, swap
# in a real voice and keep it for the character's whole life, e.g.
#
#   [stinky.voice]
#   provider = "elevenlabs"        # needs ELEVENLABS_API_KEY; exact lip-sync timings
#   id = "<voice id from your ElevenLabs voice library>"
#   model = "eleven_v4"
#
#   [stinky.voice]
#   provider = "openai"            # needs OPENAI_API_KEY
#   name = "ash"                   # a built-in OpenAI voice
#   style = "A cheeky, bouncy six-year-old boy with a big voice and a British accent."
#
# `style` is acting direction; each line adds the character's mood ("defiantly", "sadly").

[stinky]
name = "Stinky McStinkbreath"
born = "Stanley"
about = "Loves jam, bouncing on beds, and the word NOPE. Has never met a toothbrush he liked."
habit = "Won't brush his teeth, so his breath knocks out anything that hears him say hello."
# Stinky is drawn by his authored puppet (`fables puppet sheet stinky` shows every part). His
# colours are his paint-box ones pulled back from full strength so they sit together: tangerine,
# plum, teal and cream stripes, mustard shorts.
puppet = "puppets/stinky.svg"
skin = "#f4a26b"
hair-colour = "#5a2d5c"
top = "#2e9a90"
pattern = "stripes"
trim = "#f6eacf"
bottom = "#e3aa48"
shoes = "#403357"
eyes = "cocoa"
extras = ["freckles"]
# Only the parametric puppet reads these; the authored one draws its own shapes.
hair = "tuft"
legwear = "shorts"
mouth = 1.35
head = "round"
body = "bean"
nose = "button"

[stinky.voice]
name = "Junior"
rate = 185
style = "A cheeky, bouncy six-year-old boy with a big voice and a British accent."

