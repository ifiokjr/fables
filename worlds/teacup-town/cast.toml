# The folk of Teacup Town. Every table is one character.

[mochi]
name = "Mochi Mae"
about = "The smallest baker in Teacup Town, with flour on everything."
habit = "Taste-tests every cake before it is finished."
kind = "kid"
puppet = "puppets/mochi.svg"
skin = "#f7dcc8"
