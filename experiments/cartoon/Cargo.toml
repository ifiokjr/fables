[package]
name = "cartoon"
version = "0.0.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
description = "Art experiment: Stinky redrawn as an authored cut-out puppet on the fables rig."
edition = "2024"
license = "Unlicense"
publish = false
rust-version = "1.88.0"

# A standalone crate, not a member of the fables package: the experiment builds against the
# library by path and leaves the main build untouched.
[workspace]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
fables = { path = "../.." }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
